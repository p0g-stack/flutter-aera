[workspace]
members = [".", "launcher", "sim"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LGPL-3.0-or-later WITH LGPL-3.0-linking-exception"
publish = false

[package]
name = "flutter-aera"
version = "0.1.0"
description = "The Flutter embedder for AERA Recovery's generic pixel + GPU plugin host"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "flutter_aera"
path = "src/lib.rs"

[[bin]]
name = "aera-flutter"
path = "src/main.rs"

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
libc = "0.2"
libloading = "0.8"
serde_json = "1"

[build-dependencies]
bindgen = { version = "0.70", default-features = false, features = ["runtime"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
