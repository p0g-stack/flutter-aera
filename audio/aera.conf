# ALSA's whole configuration in the payload (aera-flutter points
# ALSA_CONFIG_PATH here and ALSA_PLUGIN_DIR at usr/lib/alsa-lib).
# Recovery has no sound card ALSA could use: every PCM is AERA's audio
# bridge (pcm_aera.c), behind `plug` for format, rate and channel
# conversion.

# What `plug` and the rate plugin look up in alsa.conf; linear is built in.
defaults.pcm.rate_converter "linear"

pcm.aera {
	type aera
	hint.description "AERA audio bridge"
}

pcm.!default {
	type plug
	slave.pcm "aera"
	hint.description "AERA audio bridge"
}
